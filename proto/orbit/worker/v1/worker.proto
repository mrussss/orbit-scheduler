syntax = "proto3";

package orbit.worker.v1;

option go_package = "github.com/mrussss/orbit-scheduler/gen/orbit/worker/v1;workerv1";

service WorkerService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc FetchTasks(FetchTasksRequest) returns (FetchTasksResponse);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);
  rpc SetDraining(SetDrainingRequest) returns (SetDrainingResponse);
  rpc RecordAgentStep(RecordAgentStepRequest) returns (RecordAgentStepResponse);
}

message RegisterWorkerRequest {
  string worker_name = 1;
  string worker_instance_id = 2;
  string hostname = 3;
  int32 capacity = 4;
  repeated string supported_task_types = 5;
  string process_version = 6;
  bytes metadata_json = 7;
}
message RegisterWorkerResponse { int64 registered_at_unix_ms = 1; }

message HeartbeatRequest {
  string worker_instance_id = 1;
  int32 running_tasks = 2;
  int32 available_capacity = 3;
  bool draining = 4;
  int64 process_uptime_ms = 5;
}
message HeartbeatResponse { int64 server_time_unix_ms = 1; }

message FetchTasksRequest {
  string worker_instance_id = 1;
  int32 requested = 2;
  int64 lease_duration_ms = 3;
  string trace_id = 4;
}
message FetchTasksResponse { repeated TaskAssignment tasks = 1; }
message TaskAssignment {
  string task_id = 1;
  string project_id = 2;
  optional string job_id = 3;
  string task_type = 4;
  bytes payload_json = 5;
  int32 attempt_no = 6;
  int64 lease_expires_at_unix_ms = 7;
  int64 execution_timeout_ms = 8;
  optional int64 overall_deadline_unix_ms = 9;
  string trace_id = 10;
}

message RenewLeaseRequest {
  string task_id = 1;
  string worker_instance_id = 2;
  int32 attempt_no = 3;
  int64 extension_ms = 4;
}
message RenewLeaseResponse {
  int64 lease_expires_at_unix_ms = 1;
  bool cancel_requested = 2;
}

enum TaskOutcome {
  TASK_OUTCOME_UNSPECIFIED = 0;
  TASK_OUTCOME_SUCCEEDED = 1;
  TASK_OUTCOME_RETRYABLE_FAILURE = 2;
  TASK_OUTCOME_PERMANENT_FAILURE = 3;
  TASK_OUTCOME_TIMEOUT = 4;
  TASK_OUTCOME_CANCELED = 5;
}
message ReportResultRequest {
  string task_id = 1;
  string worker_instance_id = 2;
  int32 attempt_no = 3;
  TaskOutcome outcome = 4;
  bytes result_json = 5;
  bytes result_hash = 6;
  string error_type = 7;
  string error_message = 8;
  int64 execution_started_at_unix_ms = 9;
  int64 execution_finished_at_unix_ms = 10;
}
message ReportResultResponse {
  string status = 1;
  bool idempotent = 2;
  optional int64 available_at_unix_ms = 3;
}

message SetDrainingRequest { string worker_instance_id = 1; bool draining = 2; }
message SetDrainingResponse { int64 server_time_unix_ms = 1; }

message RecordAgentStepRequest {
  string task_id = 1;
  string worker_instance_id = 2;
  int32 attempt_no = 3;
  int32 step_no = 4;
  string kind = 5;
  string tool_name = 6;
  bytes input_summary_json = 7;
  bytes output_summary_json = 8;
  string status = 9;
  int64 started_at_unix_ms = 10;
  optional int64 finished_at_unix_ms = 11;
}
message RecordAgentStepResponse {}
