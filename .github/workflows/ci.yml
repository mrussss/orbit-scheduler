name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: true
      - run: go mod download
      - run: make lint
      - run: make test-race
      - run: make build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: true
      - run: go mod download
      - run: make test-integration

  phase5-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: true
      - run: go mod download
      - run: make smoke-phase5

  mysql8-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false
      - name: Download MySQL Lab dependencies
        working-directory: experiments/mysql8
        run: go mod download
      - name: Run MySQL Lab tests
        run: make test-mysql-lab
      - name: Run MySQL concurrency tests
        run: make test-mysql-concurrency
